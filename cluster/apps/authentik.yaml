# authentik, the identity provider, at https://auth.lab.ehakan.dev. The chart
# (values in configs/authentik/values.yaml), plus configs/authentik/resources/:
# secrets, route and blueprints. Its database is in db-management.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.3
      helm:
        releaseName: authentik
        valueFiles:
          - $values/cluster/configs/authentik/values.yaml
    - repoURL: https://github.com/ehakan/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ehakan/homelab.git
      targetRevision: main
      path: cluster/configs/authentik/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Needs the External Secrets CRDs and the Gateway API CRDs.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
