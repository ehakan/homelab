# PostgreSQL cluster `management`: one database per management app. See cluster/configs/db-management/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-management
  namespace: argocd
  # Being removed: deleting this Application also deletes what it deployed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ehakan/homelab.git
    targetRevision: main
    path: cluster/configs/db-management
  destination:
    server: https://kubernetes.default.svc
    namespace: db-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # Needs the CloudNativePG and External Secrets CRDs.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
