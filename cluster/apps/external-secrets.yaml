# External Secrets Operator: syncs secrets from 1Password into Kubernetes
# Secrets. The chart (values in configs/external-secrets/values.yaml), plus the
# ClusterSecretStores in configs/external-secrets/secretstores/.
# Their service account tokens are the only Secrets created by hand (see
# cluster/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.12.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/cluster/configs/external-secrets/values.yaml
    - repoURL: https://github.com/ehakan/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ehakan/homelab.git
      targetRevision: main
      path: cluster/configs/external-secrets/secretstores
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # The store is validated by the operator's webhook, which may not be
    # serving yet on the first sync.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
