# Grafana Operator: runs the Grafana instance, its data sources and dashboards
# declared in configs/observability/resources/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-operator
  namespace: argocd
spec:
  project: default
  sources:
    # OCI registry: Argo CD expects no oci:// scheme here.
    - repoURL: ghcr.io/grafana/helm-charts
      chart: grafana-operator
      targetRevision: 5.25.0
      helm:
        releaseName: grafana-operator
        valueFiles:
          - $values/cluster/configs/grafana-operator/values.yaml
    - repoURL: https://github.com/ehakan/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
