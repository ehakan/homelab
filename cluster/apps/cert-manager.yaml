# cert-manager: issues TLS certificates, including for Gateways (Gateway API
# support enabled in configs/cert-manager/values.yaml), plus the Let's Encrypt
# ClusterIssuers in configs/cert-manager/issuers/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    # OCI registry: Argo CD expects no oci:// scheme here.
    - repoURL: quay.io/jetstack/charts
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/cluster/configs/cert-manager/values.yaml
    - repoURL: https://github.com/ehakan/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ehakan/homelab.git
      targetRevision: main
      path: cluster/configs/cert-manager/issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # The issuers wait for the webhook and for External Secrets' CRDs.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
