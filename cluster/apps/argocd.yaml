# Argo CD managing itself (kustomize, cluster/configs/argocd). Bootstrapped by
# hand from the unpatched upstream install.yaml; this Application then applies
# the patched config in place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ehakan/homelab.git
    targetRevision: main
    path: cluster/configs/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # The routes and the admin ExternalSecret need the Gateway API and
    # External Secrets CRDs from other apps.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
