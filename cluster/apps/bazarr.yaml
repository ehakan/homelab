# Bazarr (namespace `media`, hl-tal-tower-01). Shared pieces: media-base.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bazarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ehakan/homelab.git
    targetRevision: main
    path: cluster/configs/bazarr
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # Needs the `media` namespace and Secrets from media-base.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
