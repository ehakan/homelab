# CNI and kube-proxy replacement. Bootstrapped by hand with the same chart
# version and values (see cluster/README.md), then adopted by Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.20.2
      helm:
        releaseName: cilium
        valueFiles:
          - $values/cluster/configs/cilium/values.yaml
    - repoURL: https://github.com/ehakan/homelab.git
      targetRevision: main
      ref: values
    # LB IP pool and L2 announcements.
    - repoURL: https://github.com/ehakan/homelab.git
      targetRevision: main
      path: cluster/configs/cilium/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # The chart generates fresh Hubble TLS certs on every render. Keep the ones
  # in the cluster instead of rotating them (and restarting Cilium) every sync.
  ignoreDifferences:
    - kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
