# Configarr (namespace `media`): TRaSH quality profiles for Radarr and Sonarr.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: configarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ehakan/homelab.git
    targetRevision: main
    path: cluster/configs/configarr
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # Needs the `media` namespace and the Radarr/Sonarr API key Secrets.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
