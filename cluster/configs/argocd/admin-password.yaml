# Local `admin` password from 1Password (homelab-management/argocd-admin),
# bcrypt-hashed into argocd-secret, which upstream install.yaml creates; Argo
# CD keeps its own keys there, so only these two are merged in.
#
# OnChange: hashed once instead of on every refresh (bcrypt salts differ, and
# a new passwordMtime logs everyone out). Change the password only in
# 1Password, never in the UI or with `argocd account update-password` (that
# would overwrite this until the next sync), then re-sync with:
#   kubectl -n argocd annotate externalsecret argocd-admin force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-management
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      data:
        admin.password: "{{ .password | bcrypt }}"
        admin.passwordMtime: '{{ dateInZone "2006-01-02T15:04:05Z" (now) "UTC" }}'
  data:
    - secretKey: password
      remoteRef:
        key: argocd-admin/password
