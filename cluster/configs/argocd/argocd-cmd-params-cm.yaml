# Component flags.
# All options: https://argo-cd.readthedocs.io/en/stable/operator-manual/argocd-cmd-params-cm-yaml/
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  # Serve plain HTTP; TLS terminates at the Gateway once Argo CD gets an
  # HTTPRoute. Until then: kubectl port-forward.
  server.insecure: "true"

  # Diff through a server-side dry-run apply, so fields the API server
  # defaults (e.g. Gateway API parentRefs group/kind, HTTPRoute matches) don't
  # show as permanent OutOfSync. Takes effect after restarting the
  # application controller.
  controller.diff.server.side: "true"
