# Argo CD from the upstream manifests, configured with patches.
# Bootstrap applies the same install.yaml unpatched (cluster/README.md); keep
# the versions in sync.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - httproute.yaml
  - grpcroute.yaml
  - admin-password.yaml
  - repo-creds.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml
patches:
  - path: argocd-cm.yaml
  - path: argocd-cmd-params-cm.yaml
  - path: argocd-rbac-cm.yaml
  - path: argocd-server-service.yaml
  # No Dex: Argo CD only uses it when dex.config is set; SSO will go straight
  # to an OIDC provider (oidc.config in argocd-cm.yaml).
  - target:
      name: argocd-dex-server.*
    patch: |
      $patch: delete
      kind: Deployment
      metadata:
        name: argocd-dex-server
