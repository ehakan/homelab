# Argo CD from the upstream manifests, configured with patches.
# Bootstrap applies the same install.yaml unpatched (cluster/README.md); keep
# the versions in sync.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - resources/namespace.yaml
  - resources/httproute.yaml
  - resources/grpcroute.yaml
  - resources/admin-password.yaml
  - resources/repo-creds.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml
patches:
  - path: patches/argocd-cm.yaml
  - path: patches/argocd-cmd-params-cm.yaml
  - path: patches/argocd-rbac-cm.yaml
  - path: patches/argocd-server-service.yaml
  - path: patches/service-names.yaml
  - path: patches/redis-image.yaml
  - path: patches/redis-args.yaml
    target:
      kind: Deployment
      name: argocd-redis
  # No Dex: Argo CD only uses it when dex.config is set; SSO will go straight
  # to an OIDC provider (oidc.config in patches/argocd-cm.yaml).
  - target:
      name: argocd-dex-server.*
    patch: |
      $patch: delete
      kind: Deployment
      metadata:
        name: argocd-dex-server
