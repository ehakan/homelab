# General settings.
# All options: https://argo-cd.readthedocs.io/en/stable/operator-manual/argocd-cm-yaml/
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Served by the internal Gateway (httproute.yaml).
  url: https://argocd.lab.ehakan.dev
  # Single sign-on through authentik. The provider (public client, PKCE) and
  # who may sign in are in authentik's `homelab - argocd` blueprint
  # (cluster/configs/authentik/resources/blueprints.yaml); roles are in
  # argocd-rbac-cm.yaml. Used by the UI and `argocd login --sso`.
  oidc.config: |
    name: authentik
    issuer: https://auth.lab.ehakan.dev/application/o/argocd/
    clientID: argocd
    enablePKCEAuthentication: true
    requestedScopes: [openid, profile, email]
  # Local `admin`: break-glass login for when authentik is down. Password:
  # 1Password homelab-management/argocd-admin (admin-password.yaml).
  admin.enabled: "true"
  # No shell into pods from the UI.
  exec.enabled: "false"
  # How often apps are compared against git when no webhook arrives.
  timeout.reconciliation: 180s
