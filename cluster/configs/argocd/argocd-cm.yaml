# General settings.
# All options: https://argo-cd.readthedocs.io/en/stable/operator-manual/argocd-cm-yaml/
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Served by the internal Gateway (httproute.yaml).
  url: https://argocd.lab.ehakan.dev
  # Local admin login until SSO is set up. Password: 1Password
  # homelab-management/argocd-admin (admin-password.yaml).
  admin.enabled: "true"
  # No shell into pods from the UI.
  exec.enabled: "false"
  # How often apps are compared against git when no webhook arrives.
  timeout.reconciliation: 180s
