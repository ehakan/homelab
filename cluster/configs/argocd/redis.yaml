# Valkey instead of Redis, for JSON logs (Redis has no structured log format).
# Argo CD only uses GET/SET/DEL/RENAME/SCAN/PUBLISH/SUBSCRIBE, all in Valkey;
# the image's entrypoint runs valkey-server for the upstream args. The args
# list replaces the upstream one: keep it in sync on Argo CD upgrades.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      containers:
        - name: redis
          image: docker.io/valkey/valkey:9.1.2-alpine
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --requirepass $(REDIS_PASSWORD)
            - --log-format
            - json
            - --log-timestamp-format
            - iso8601
