# Helm values for the authentik chart (cluster/apps/authentik.yaml).
# Defaults: helm show values authentik --repo https://charts.goauthentik.io --version <version>

authentik:
  # Empty values are left out of the chart's config Secret; the secret key
  # and the database password come from global.env below instead.
  secret_key: ""
  postgresql:
    host: management-rw.db-management.svc
    name: authentik
    user: authentik
    password: ""

global:
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secret-key
          key: secret-key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db
          key: password
    # Password of the break-glass `akadmin` user. Only read on the very first
    # start, against an empty database.
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-admin
          key: password

blueprints:
  configMaps:
    - authentik-blueprints
