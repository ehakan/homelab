# authentik configuration as blueprints, applied by the worker on start and
# whenever they change. One key per blueprint; keys must end in `.yaml`.
# Format: https://docs.goauthentik.io/customize/blueprints/
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
data:
  groups.yaml: |
    version: 1
    metadata:
      name: homelab - groups
    entries:
      # Everything, everywhere.
      - model: authentik_core.group
        identifiers:
          name: admins
        attrs:
          is_superuser: true
      # Entertainment services.
      - model: authentik_core.group
        identifiers:
          name: family
      # AI tools.
      - model: authentik_core.group
        identifiers:
          name: friends
  users.yaml: |
    version: 1
    metadata:
      name: homelab - users
    entries:
      # The groups referenced below must exist first.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: homelab - groups
          required: true
      # Day-to-day admin account. Set its password (or a passkey) as akadmin,
      # the break-glass user.
      - model: authentik_core.user
        identifiers:
          username: ehakan
        attrs:
          name: ehakan
          type: internal
          groups:
            - !Find [authentik_core.group, [name, admins]]
  argocd.yaml: |
    version: 1
    metadata:
      name: homelab - argocd
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: homelab - groups
          required: true
      # Public client with PKCE, shared by the web UI and `argocd login --sso`
      # (the CLI exchanges the code itself, so it can't hold a secret, and one
      # provider means one issuer for Argo CD to trust).
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: argocd
        attrs:
          client_type: public
          client_id: argocd
          # Empty (no grant allowed) unless set; the UI fills these in.
          grant_types: [authorization_code, refresh_token]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.lab.ehakan.dev/auth/callback
            - matching_mode: strict
              url: http://localhost:8085/auth/callback
          # `profile` carries the `groups` claim Argo CD's RBAC uses.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        id: app
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          provider: !KeyOf provider
          meta_launch_url: https://argocd.lab.ehakan.dev
      # Only admins can sign in.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app
          group: !Find [authentik_core.group, [name, admins]]
        attrs:
          order: 0
