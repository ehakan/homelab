# authentik's secret key (signs sessions and cookies): generated once into the
# 1Password item `authentik-secret-key` (vault homelab-generated). Changing it
# logs everyone out.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authentik-secret-key
spec:
  updatePolicy: IfNotExists
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: homelab-generated
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: authentik-secret-key
          property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-generated
  target:
    # Not `authentik`: that's the chart's config Secret.
    name: authentik-secret-key
  data:
    - secretKey: secret-key
      remoteRef:
        key: authentik-secret-key/password
---
# Database password, generated by db-management (configs/db-management/authentik.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-generated
  target:
    name: authentik-db
  data:
    - secretKey: password
      remoteRef:
        key: authentik-db/password
---
# Break-glass `akadmin` password: the 1Password item `authentik-admin` in
# homelab-management, created by hand (see cluster/README.md). Only used when
# authentik first initialises its database; change it later in authentik
# itself, then update the item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-management
  target:
    name: authentik-admin
  data:
    - secretKey: password
      remoteRef:
        key: authentik-admin/password
