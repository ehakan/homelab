# Sonarr: main and log databases (SONARR__POSTGRES__MAINDB / __LOGDB), owned by the role `sonarr`.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: sonarr-main
spec:
  cluster:
    name: media-postgres
  name: sonarr-main
  owner: sonarr
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: sonarr-log
spec:
  cluster:
    name: media-postgres
  name: sonarr-log
  owner: sonarr
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: sonarr
spec:
  cluster:
    name: media-postgres
  name: sonarr
  login: true
  passwordSecret:
    name: sonarr-db
---
# The role's password: read back from the 1Password item `sonarr-db` (vault
# homelab-generated) into the Secret `sonarr-db`, which the app reads too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-generated
  target:
    name: sonarr-db
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Apply password changes to the role.
          cnpg.io/reload: "true"
      data:
        username: sonarr
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: sonarr-db/password
---
# Generates the password once into that item.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: sonarr-db
spec:
  # Only creates the item; never overwrites it.
  updatePolicy: IfNotExists
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: homelab-generated
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: sonarr-db
          property: password
