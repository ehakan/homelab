# Random values for the PushSecrets in this namespace (database passwords, API
# keys). Lowercase letters and digits only: safe in connection URIs, and the
# same alphabet the *arr apps use for their own API keys.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: password
spec:
  length: 32
  digits: 10
  symbols: 0
  noUpper: true
  allowRepeat: true
