# Helm values for the cert-manager chart (cluster/apps/cert-manager.yaml).
# Defaults: helm show values oci://quay.io/jetstack/charts/cert-manager --version <version>

crds:
  enabled: true

config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  # Certificates for Gateways (gateway shim) and HTTP-01 challenges via
  # HTTPRoute. Needs the Gateway API CRDs (gateway-api app) at startup.
  gatewayAPI:
    enabled: true
  logging:
    format: json

webhook:
  podAnnotations:
    resource.opentelemetry.io/service.name: cert-manager-webhook
  config:
    apiVersion: webhook.config.cert-manager.io/v1alpha1
    kind: WebhookConfiguration
    logging:
      format: json

cainjector:
  podAnnotations:
    resource.opentelemetry.io/service.name: cert-manager-cainjector
  config:
    apiVersion: cainjector.config.cert-manager.io/v1alpha1
    kind: CAInjectorConfiguration
    logging:
      format: json

# Service names in logs and metrics (cluster/README.md, Observability).
podAnnotations:
  resource.opentelemetry.io/service.name: cert-manager
startupapicheck:
  podAnnotations:
    resource.opentelemetry.io/service.name: cert-manager-startupapicheck
