# Log storage: VictoriaLogs single node, at
# http://vlsingle-logs.observability.svc:9428 (LogsQL, OTLP logs ingestion).
apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: logs
spec:
  retentionPeriod: 14d
  extraArgs:
    loggerFormat: json
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
  # Service name in logs and metrics (cluster/README.md, Observability).
  podMetadata:
    annotations:
      resource.opentelemetry.io/service.name: victorialogs
  nodeSelector:
    kubernetes.io/hostname: hl-tal-mini-01
  # ~200Mi steady; ingesting a backlog (both node collectors catching up at
  # once) went past 512Mi.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 768Mi
