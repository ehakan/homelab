# Permissions for the collectors (collector-cluster.yaml, collector-node.yaml)
# and the `cluster` collector's Target Allocator. The operator creates their
# service accounts; it doesn't grant them anything (createRbacPermissions is
# off), so everything they can do is listed here.
#
# Target Allocator: discovers targets and reads the Prometheus Operator
# resources. Secrets only in `observability`, below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-cluster-targetallocator
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, namespaces, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, podmonitors, probes, scrapeconfigs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-cluster-targetallocator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-cluster-targetallocator
subjects:
  - kind: ServiceAccount
    name: cluster-targetallocator
    namespace: observability
---
# Target Allocator: Secrets in `observability`, its prometheusCR.secretNamespaces
# default. It always watches Secrets there (metadata only; values only for
# Secrets a monitor references), and without this logs a "secrets is
# forbidden" error every few seconds. There's no setting to turn the watch off
# or narrow it by label, and RBAC can't limit list/watch to some Secrets, so
# this also lets it read every Secret in `observability` (grafana-admin, ...).
#
# TODO: remove this Role and RoleBinding once the error can be handled
# properly instead: the watch disabled upstream, or the log line dropped in
# the log pipeline (`filter` processor on the node collector).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-cluster-targetallocator-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-cluster-targetallocator-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-cluster-targetallocator-secrets
subjects:
  - kind: ServiceAccount
    name: cluster-targetallocator
    namespace: observability
---
# `cluster` collector: reads Kubernetes objects (k8s_cluster, k8s_attributes),
# watches events (k8s_objects) and scrapes the API server's /metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-cluster-collector
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - namespaces
      - services
      - replicationcontrollers
      - resourcequotas
      - persistentvolumes
      - persistentvolumeclaims
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-cluster-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-cluster-collector
subjects:
  - kind: ServiceAccount
    name: cluster-collector
    namespace: observability
---
# `node` collector: the kubelet's stats API (kubelet_stats) and pod metadata
# (k8s_attributes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-node-collector
rules:
  - apiGroups: [""]
    resources: [nodes/stats]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-node-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-node-collector
subjects:
  - kind: ServiceAccount
    name: node-collector
    namespace: observability
