# Grafana data sources. VictoriaMetrics through the built-in Prometheus type:
# its query API is Prometheus-compatible, and shared dashboards expect that
# type. VictoriaLogs needs its plugin, which the operator installs.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriametrics
spec:
  instanceSelector:
    matchLabels:
      instance: grafana
  datasource:
    name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://vmsingle-metrics.observability.svc:8428
    isDefault: true
    jsonData:
      timeInterval: 30s # the collector's scrape interval
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victorialogs
spec:
  instanceSelector:
    matchLabels:
      instance: grafana
  plugins:
    - name: victoriametrics-logs-datasource
      version: 0.33.1
  datasource:
    name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://vlsingle-logs.observability.svc:9428
