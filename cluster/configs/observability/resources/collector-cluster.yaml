# The cluster-level OpenTelemetry collector (one replica, mini-01):
#
# - Kubernetes object state (k8s_cluster receiver): pod phases, container
#   states and stuck reasons, restarts, workload replica counts, node
#   conditions, volume claims, requests and limits. Pod labels are added as
#   `k8s.pod.label.<key>` (k8s_attributes). Sent over OTLP, so names stay
#   OpenTelemetry's (`k8s.container.restarts{k8s.pod.name="..."}`).
# - Prometheus-format targets: its Target Allocator discovers them from the
#   static scrape configs below plus every ServiceMonitor, PodMonitor, Probe
#   and ScrapeConfig in the cluster. Sent with Prometheus remote write, which
#   keeps their names and labels exactly as exposed (`disable_scope_info`
#   drops the otel_scope_* labels it would add).
# - Kubernetes events (k8s_objects receiver) to `logs`, one log line per event
#   and per repeat: the event's note as the message, its reason, type and
#   object as fields.
#
# Contrib image: the only one with the remote-write exporter.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: cluster
spec:
  mode: statefulset
  replicas: 1
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0
  # Service name in logs and metrics (cluster/README.md, Observability).
  podAnnotations:
    resource.opentelemetry.io/service.name: otel-cluster-collector
  nodeSelector:
    kubernetes.io/hostname: hl-tal-mini-01
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  targetAllocator:
    enabled: true
    prometheusCR:
      enabled: true
      scrapeInterval: 30s
      # Empty selectors: every resource, in every namespace.
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}
      probeSelector: {}
      probeNamespaceSelector: {}
      scrapeConfigSelector: {}
      scrapeConfigNamespaceSelector: {}
    nodeSelector:
      kubernetes.io/hostname: hl-tal-mini-01
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
  config:
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        # Every condition comes from k8s.node.condition below; this would add
        # one more metric per condition.
        node_conditions_to_report: []
        allocatable_types_to_report: [cpu, memory, ephemeral-storage, pods]
        metrics:
          # Optional (all of this receiver's metrics are in development).
          k8s.container.status.reason:
            enabled: true
          k8s.container.status.state:
            enabled: true
          k8s.pod.status_reason:
            enabled: true
          k8s.node.condition:
            enabled: true
          k8s.persistentvolume.status.phase:
            enabled: true
          k8s.persistentvolume.storage.capacity:
            enabled: true
          k8s.persistentvolumeclaim.status.phase:
            enabled: true
          k8s.persistentvolumeclaim.storage.capacity:
            enabled: true
          k8s.persistentvolumeclaim.storage.request:
            enabled: true
        resource_attributes:
          # Why a container last stopped (OOMKilled, Error, ...).
          k8s.container.status.last_terminated_reason:
            enabled: true
      k8s_objects:
        auth_type: serviceAccount
        objects:
          - name: events
            group: events.k8s.io
            mode: watch
            # Deletions are only events expiring (after an hour).
            exclude_watch_type: [DELETED]
      prometheus:
        config:
          global:
            scrape_interval: 30s
          # Static targets; everything else comes from ServiceMonitors & co.
          # The Target Allocator runs the discovery, the collector only
          # scrapes, with its service account's token (collector-rbac.yaml).
          scrape_configs:
            # API server: the `kubernetes` Service in `default`.
            - job_name: apiserver
              scheme: https
              kubernetes_sd_configs:
                - role: endpointslice
                  namespaces:
                    names: [default]
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
                  regex: kubernetes;https
                  action: keep
              # Only these. Everything it exposes is ~95k series, almost all
              # histogram buckets; this is ~2.6k. Latency is the SLI
              # histogram's sum and count (averages); its buckets, for
              # percentiles, would add ~10k.
              metric_relabel_configs:
                - source_labels: [__name__]
                  action: keep
                  regex: >-
                    apiserver_request_total|apiserver_request_sli_duration_seconds_(sum|count)|apiserver_current_inflight_requests|apiserver_flowcontrol_current_inflight_requests|apiserver_flowcontrol_rejected_requests_total|apiserver_admission_webhook_rejection_count|apiserver_admission_webhook_admission_duration_seconds_(sum|count)|apiserver_resource_objects|apiserver_storage_size_bytes|etcd_requests_total|etcd_request_errors_total|apiserver_client_certificate_expiration_seconds_(bucket|count)|process_.+|go_goroutines|go_memstats_heap_inuse_bytes
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      # Pod labels on every pod and container series, as
      # k8s.pod.label.<key>, and the service, as in the node collector.
      k8s_attributes:
        auth_type: serviceAccount
        extract:
          otel_annotations: true
          metadata: [k8s.namespace.name, k8s.pod.name, service.name, service.version]
          labels:
            - tag_name: k8s.pod.label.$$1
              key_regex: (.*)
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
      # Service names (cluster/README.md, Observability) where the pod's
      # annotation can't set one: Talos' static pods (named after their node)
      # and the Target Allocator (made by the operator, no pod annotations).
      # Versions: none instead of the Target Allocator's `latest` label, and
      # no image digest after the tag.
      transform/service:
        error_mode: ignore
        metric_statements: &service
          - replace_pattern(resource.attributes["service.name"], "^(kube-apiserver|kube-controller-manager|kube-scheduler)-.+$", "$$1") where resource.attributes["k8s.namespace.name"] == "kube-system"
          - set(resource.attributes["service.name"], "otel-target-allocator") where resource.attributes["k8s.namespace.name"] == "observability" and IsMatch(resource.attributes["k8s.pod.name"], "^cluster-targetallocator-")
          - delete_key(resource.attributes, "service.version") where resource.attributes["service.version"] == "latest"
          - replace_pattern(resource.attributes["service.version"], "@sha256:[0-9a-f]+$", "")
        log_statements: *service
      # The same on everything from this cluster; an app's own environment
      # (pod annotation or SDK) wins.
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: homelab
            action: upsert
          - key: deployment.environment.name
            value: prod
            action: insert
      # Resource attributes become labels in VictoriaMetrics; these would only
      # add churn.
      resource/trim:
        attributes:
          - pattern: ^k8s\..+\.uid$
            action: delete
          - key: container.id
            action: delete
      # The receiver's log body is the whole watch event ({type, object});
      # this keeps what's worth searching. The namespace is already a resource
      # attribute. Kubernetes' own repeat count rises with each MODIFIED event,
      # which is a new log line too.
      transform/events:
        error_mode: ignore
        log_statements:
          # Canonical level names, as for pod logs.
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.body["object"]["type"] == "Warning"
          - set(log.severity_text, "WARN") where log.body["object"]["type"] == "Warning"
          - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.body["object"]["type"] == "Normal"
          - set(log.severity_text, "INFO") where log.body["object"]["type"] == "Normal"
          - set(log.attributes["k8s.event.reason"], log.body["object"]["reason"])
          - set(log.attributes["k8s.event.action"], log.body["object"]["action"]) where log.body["object"]["action"] != nil
          - set(log.attributes["k8s.event.count"], log.body["object"]["deprecatedCount"]) where log.body["object"]["deprecatedCount"] != nil
          - set(log.attributes["k8s.event.count"], log.body["object"]["series"]["count"]) where log.body["object"]["series"] != nil
          - set(log.attributes["k8s.event.controller"], log.body["object"]["reportingController"]) where log.body["object"]["reportingController"] != nil and log.body["object"]["reportingController"] != ""
          - set(log.attributes["k8s.event.controller"], log.body["object"]["deprecatedSource"]["component"]) where log.attributes["k8s.event.controller"] == nil and log.body["object"]["deprecatedSource"] != nil
          - set(log.attributes["k8s.object.kind"], log.body["object"]["regarding"]["kind"])
          - set(log.attributes["k8s.object.name"], log.body["object"]["regarding"]["name"])
          - set(log.attributes["k8s.object.field_path"], log.body["object"]["regarding"]["fieldPath"]) where log.body["object"]["regarding"]["fieldPath"] != nil
          - delete_key(log.attributes, "event.domain")
          - delete_key(log.attributes, "k8s.resource.name")
          - set(log.time, log.observed_time)
          # Last: the body is the event until here.
          - set(log.body, log.body["object"]["note"]) where log.body["object"]["note"] != nil and log.body["object"]["note"] != ""
          - set(log.body, log.attributes["k8s.event.reason"]) where IsMap(log.body)
      batch: {}
    exporters:
      otlp_http:
        endpoint: http://vmsingle-metrics.observability.svc:8428/opentelemetry
        tls:
          insecure: true
      prometheus_remote_write:
        endpoint: http://vmsingle-metrics.observability.svc:8428/api/v1/write
        disable_scope_info: true
        target_info:
          enabled: false
      otlp_http/events:
        logs_endpoint: http://vlsingle-logs.observability.svc:9428/insert/opentelemetry/v1/logs
        headers:
          # Otherwise every resource attribute would be one.
          VL-Stream-Fields: k8s.namespace.name
          VL-Ignore-Fields: scope.*
    service:
      telemetry:
        logs:
          encoding: json
      pipelines:
        metrics/kubernetes:
          receivers: [k8s_cluster]
          processors: [memory_limiter, k8s_attributes, transform/service, resource/trim, resource/cluster, batch]
          exporters: [otlp_http]
        metrics/prometheus:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus_remote_write]
        logs/events:
          receivers: [k8s_objects]
          processors: [memory_limiter, transform/events, resource/cluster, batch]
          exporters: [otlp_http/events]
