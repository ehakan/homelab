# Bazarr: downloads English and Turkish subtitles for Radarr's and Sonarr's
# library and writes them next to the videos. Database in media-postgres
# (Secret `bazarr-db`). Providers, languages and the Radarr/Sonarr
# connections are set through its API (cluster/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
spec:
  replicas: 1
  # Single-node volumes: the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr
    spec:
      # TRaSH's single shared user: every media app runs as 1000:1000, so
      # they can all read and write each other's files under /data.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: hl-tal-tower-01
      containers:
        - name: bazarr
          image: ghcr.io/home-operations/bazarr:1.6.2
          env:
            - name: BAZARR__PORT
              value: "6767"
            - name: POSTGRES_ENABLED
              value: "true"
            - name: POSTGRES_HOST
              value: media-postgres-rw
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: bazarr
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bazarr-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bazarr-db
                  key: password
          ports:
            - name: http
              containerPort: 6767
          readinessProbe:
            httpGet:
              path: /api/system/ping
              port: http
          livenessProbe:
            httpGet:
              path: /api/system/ping
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            # Same path as in Radarr and Sonarr, so Bazarr finds the files
            # they report and writes subtitles next to them.
            - name: data
              mountPath: /data/media
              subPath: media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
---
# config.yaml (settings, provider logins), logs and backups; the database is
# in media-postgres.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
spec:
  selector:
    app.kubernetes.io/name: bazarr
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - bazarr.lab.ehakan.dev
  rules:
    - backendRefs:
        - name: bazarr
          port: 80
