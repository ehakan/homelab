# Application secrets: the 1Password vault `homelab-cluster`, readable from
# every namespace. Reference it from an ExternalSecret with:
#
#   secretStoreRef:
#     kind: ClusterSecretStore
#     name: homelab-cluster
#   data:
#     - secretKey: password
#       remoteRef:
#         key: <item>/<field>        # or <item>/<section>/<field>
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: homelab-cluster
spec:
  provider:
    onepasswordSDK:
      vault: homelab-cluster
      auth:
        # Created by hand during bootstrap; never in git.
        serviceAccountSecretRef:
          namespace: external-secrets
          name: onepassword-homelab-cluster
          key: token
