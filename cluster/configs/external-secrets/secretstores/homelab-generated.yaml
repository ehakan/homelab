# Generated secrets (database passwords, signing keys, OIDC client secrets):
# the 1Password vault `homelab-generated`, read and write. The cluster seeds
# each item once with a PushSecret (updatePolicy: IfNotExists) and reads it back
# with ExternalSecrets like any other store, so values survive rebuilds.
# Example: a PushSecret with a Password generator, updatePolicy IfNotExists,
# plus an ExternalSecret reading the same item.
#
# Writable, so only the namespaces listed below can use it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: homelab-generated
spec:
  conditions:
    # None yet: an empty list allows no namespace.
    - namespaces: []
  provider:
    onepasswordSDK:
      vault: homelab-generated
      auth:
        # Created by hand during bootstrap; never in git.
        serviceAccountSecretRef:
          namespace: external-secrets
          name: onepassword-homelab-generated
          key: token
