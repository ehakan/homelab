# Cilium on Talos: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium

ipam:
  mode: kubernetes

# Talos runs no kube-proxy (talos/patches/common.yaml). Cilium replaces it and
# reaches the API server through KubePrism, Talos's local API proxy.
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos doesn't allow loading kernel modules, so SYS_MODULE is dropped.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Talos already mounts cgroupv2.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Gateway API is handled by agentgateway, not Cilium.
gatewayAPI:
  enabled: false

operator:
  # Single schedulable node for now; the default (2) leaves one replica pending.
  replicas: 1
  rollOutPods: true

# Restart agents when their config changes.
rollOutCiliumPods: true
