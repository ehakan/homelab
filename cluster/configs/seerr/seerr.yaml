# Seerr: media requests, sending them to Radarr and Sonarr. Database in
# media-postgres (Secret `seerr-db`). Internal Gateway only for now; family
# access through the tailnet comes with the planned `family` Gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
spec:
  replicas: 1
  # Single-node volumes: the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr
    spec:
      # The image's own user (`node`) is 1000:1000 too.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: hl-tal-tower-01
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.0
          env:
            - name: PORT
              value: "5055"
            - name: DB_TYPE
              value: postgres
            - name: DB_HOST
              value: media-postgres-rw
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: seerr
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: seerr-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: seerr-db
                  key: password
          ports:
            - name: http
              containerPort: 5055
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
---
# settings.json and logs; the database is in media-postgres.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
spec:
  selector:
    app.kubernetes.io/name: seerr
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - seerr.lab.ehakan.dev
  rules:
    - backendRefs:
        - name: seerr
          port: 80
