# Radarr's API key, set through RADARR__AUTH__APIKEY instead of generated by
# Radarr, so other apps (Prowlarr, Seerr, ...) can be given it. Read back from
# the 1Password item `radarr-api-key` (vault homelab-generated).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab-generated
  target:
    name: radarr-api-key
  data:
    - secretKey: api-key
      remoteRef:
        key: radarr-api-key/password
---
# Generates the key once into that item (media-base's Password generator).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: radarr-api-key
spec:
  # Only creates the item; never overwrites it.
  updatePolicy: IfNotExists
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: homelab-generated
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: radarr-api-key
          property: password
