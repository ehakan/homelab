# authentik was removed. The database is dropped here (ensure: absent); the
# role is dropped by deleting this resource (reclaim policy delete), once the
# database is gone.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authentik
spec:
  cluster:
    name: management
  name: authentik
  owner: authentik
  ensure: absent
  databaseReclaimPolicy: delete
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: authentik
spec:
  cluster:
    name: management
  name: authentik
  login: true
  databaseRoleReclaimPolicy: delete
