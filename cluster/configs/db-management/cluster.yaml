# A single PostgreSQL instance on the node's local-storage partition: no
# replicas, no failover. Each app gets a DatabaseRole and a Database here; the
# role's password is generated into homelab-generated with a PushSecret (using
# password.yaml) and read back with an ExternalSecret.
#
# Connect from an app as <role>@management-rw.db-management.svc:5432.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: management
spec:
  instances: 1
  # Pinned, so operator upgrades don't restart the database with a new image.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  # With one instance, a PodDisruptionBudget would block draining the node.
  enablePDB: false
  storage:
    storageClass: local-path
    size: 10Gi
