# Private services: reachable from the LAN (router DNS *.lab.ehakan.dev ->
# 192.168.11.200) and the tailnet (operator subnet router + split DNS).
# Any namespace can attach HTTPRoutes to the `https` listener.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: internal # parameters.yaml
  addresses:
    - type: IPAddress
      value: 192.168.11.200 # configs/cilium/resources/lb-ipam.yaml
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.ehakan.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: internal-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.ehakan.dev"
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: internal-https-redirect
spec:
  parentRefs:
    - name: internal
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
