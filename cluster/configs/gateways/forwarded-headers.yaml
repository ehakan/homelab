# agentgateway sends neither X-Forwarded-Proto nor X-Forwarded-For to backends
# (as of v1.6.0). Without them, apps behind TLS-terminating listeners build
# http:// URLs (authentik's UI then failed on mixed content), and see every
# client as the gateway pod's IP, which they treat as LAN. Set both on both
# Gateways; `set` replaces any value a client sent itself, so it can't be
# spoofed. Apps trust X-Forwarded-For from the pod network, 10.244.0.0/16.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: forwarded-headers
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      sectionName: https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      sectionName: https
  traffic:
    transformation:
      request:
        set:
          # CEL expressions.
          - name: X-Forwarded-Proto
            value: '"https"'
          - name: X-Forwarded-For
            value: string(source.address)
