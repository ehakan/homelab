# Applied to every node.

# Cilium replaces Flannel and kube-proxy. It's installed after bootstrap and
# then managed by Argo CD, so Talos deploys no CNI. (kube-proxy is disabled in
# controlplane.yaml: KubeProxyConfig is only allowed on control plane nodes.)
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
