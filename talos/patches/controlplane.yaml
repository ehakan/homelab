# Applied to control plane nodes.

# Talos API cert: allow `talosctl` to reach the node via the cluster DNS name.
machine:
  certSANs:
    - kube.lan.ehakan.dev
---
# Kubernetes API cert: same DNS name as the cluster endpoint. JSON logs.
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - kube.lan.ehakan.dev
extraArgs:
  logging-format: json
---
# JSON logs, like the API server's.
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  logging-format: json
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  logging-format: json
---
# Allow workloads on control plane nodes (removes the default NoSchedule taint).
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
# No kube-proxy: Cilium replaces it (see common.yaml). Control plane only;
# workers reject this document.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# No CoreDNS from Talos: Argo CD runs it (cluster/configs/coredns), with
# flags Talos can't set. The objects Talos created are out of its bootstrap
# manifests inventory, so `talosctl upgrade-k8s` doesn't prune them.
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
